# control 전용 설정 (상세 설계 6.4). control 만 읽는다.
# 좌석 각도는 예시 값이다. 박병준님 측정값으로 바꾼다.
seats:
  1: {pan: 60,  tilt: 85, neighbors: [2]}
  2: {pan: 80,  tilt: 85, neighbors: [1, 3]}
  3: {pan: 100, tilt: 85, neighbors: [2, 4]}
  4: {pan: 120, tilt: 85, neighbors: [3]}
priority: {fall: 1, question: 2, away: 3}
timers:
  fall_neighbor_s: 15
  fall_all_s: 30
  question_expire_s: 180    # 임시값, 논의
  away_alert_s: 60          # 임시값, 논의
  class_condition_s: 10     # 반 집계를 강사 화면에 보내는 주기
track:
  nudge_max_hz: 10
  nudge_gain: 8.0           # dx 1.0 = 화면 폭 절반 → 몇 도 보정할지, 측정 후 조정 (방향이 반대면 음수로)
