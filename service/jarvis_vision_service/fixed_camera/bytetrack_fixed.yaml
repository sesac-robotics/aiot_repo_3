# cam1 고정 카메라 좌석 판정용 ByteTrack 설정.
# 10/22 시험: new_track_thresh 를 감지 기준(0.25)까지 낮추면 노트북 카메라 가장자리에 신뢰도 0.2~0.3 짜리
# 가짜 사람이 거의 모든 프레임에 ID 를 받았다 (0.40 일 때는 15%). 가짜 상자가 좌석 범위를 가려 '모름'을 만들고
# 등록·cam2 의 '한 명' 규칙을 깨므로 원래 값을 유지한다. 뒷줄 학생이 ID 를 못 받는지는 실제 4석 영상으로 확인한다.
tracker_type: bytetrack
track_high_thresh: 0.35
track_low_thresh: 0.10
new_track_thresh: 0.40
track_buffer: 30
match_thresh: 0.80
fuse_score: true
